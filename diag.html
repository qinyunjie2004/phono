var out = document.getElementById('out');
function log(s, cls){ out.innerHTML += "\n" + (cls ? '<span class="'+cls+'">'+s+'</span>' : s); }
function reset(){ out.innerHTML = ""; }
function env(){
  log("UA: " + navigator.userAgent);
  log("微信浏览器: " + (/MicroMessenger/i.test(navigator.userAgent) ? "是" : "否"));
  log("canPlayType mp3: [" + (new Audio().canPlayType('audio/mpeg') || '空') + "]");
  log("speechSynthesis: " + ('speechSynthesis' in window ? "有" : "无"));
  if('speechSynthesis' in window){
    var vs = speechSynthesis.getVoices();
    log("可用嗓音数: " + vs.length + (vs.length ? "（如 " + vs[0].name + "）" : ""));
  }
  log("在线状态: " + (navigator.onLine ? "在线" : "离线"));
}
function probe(a, name, done){
  var t0 = Date.now(), finished = false;
  function fin(ok, msg){
    if(finished) return; finished = true;
    log(name + ": " + (ok ? "播放成功" : "失败") + " · " + msg, ok ? "ok" : "bad");
    done && done(ok);
  }
  a.onerror = function(){
    var c = a.error ? ("code=" + a.error.code + " " + (a.error.message||"")) : "无error详情";
    fin(false, "onerror " + c);
  };
  setTimeout(function(){
    if(finished) return;
    if(a.currentTime > 0.05) fin(true, "已出声 " + a.currentTime.toFixed(1) + "s");
    else fin(false, "8秒未出声 readyState=" + a.readyState + " networkState=" + a.networkState);
  }, 8000);
  var p = a.play();
  if(p && p.then) p.then(function(){ log(name + ": play() 已允许"); })
                 .catch(function(e){ fin(false, "play()被拒: " + e.name + " " + e.message); });
}
function tBase64(done){
  log("\n[① 内嵌 base64 mp3]");
  probe(new Audio(B64), "①", done);
}
function tCloud(done){
  log("\n[② 云语音 URL]");
  probe(new Audio("https://fanyi.baidu.com/gettts?lan=en&spd=3&source=web&text=apple"), "②", done);
}
function tTts(done){
  log("\n[③ 浏览器机器音]");
  if(!('speechSynthesis' in window)){ log("③: 不支持 speechSynthesis", "bad"); done && done(false); return; }
  try{
    var u = new SpeechSynthesisUtterance("apple");
    u.lang = "en-GB"; u.rate = 0.9;
    u.onend = function(){ log("③: 播放成功", "ok"); done && done(true); };
    u.onerror = function(e){ log("③: 失败 " + e.error, "bad"); done && done(false); };
    speechSynthesis.cancel(); speechSynthesis.speak(u);
    setTimeout(function(){
      if(!speechSynthesis.speaking && !speechSynthesis.pending){ /* onend/onerror 会处理 */ }
    }, 500);
  }catch(e){ log("③: 异常 " + e.message, "bad"); done && done(false); }
}
function tAll(){
  reset(); env();
  tBase64(function(){
    tCloud(function(){
      tTts(function(){
        log("\n—— 测完，截图发给老师 ——", "ok");
      });
    });
  });
}
